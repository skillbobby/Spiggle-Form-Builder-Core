name: Bump update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Increment UPDATE, README, and Pages footer
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qx UPDATE; then
              echo "UPDATE already changed in this push"
              exit 0
            fi
          fi
          n=0
          if [ -f UPDATE ]; then
            n=$(tr -d '[:space:]' < UPDATE)
          fi
          n=$((n + 1))
          printf '%s\n' "$n" > UPDATE
          if [ -f README.md ]; then
            sed -i -E "s/(\\| \\*\\*Update\\*\\* \\| )[0-9]+/\\1${n}/" README.md
          fi
          if [ -d docs ]; then
            find docs -name '*.html' -exec sed -i -E "s/(class=\"footer-update\">update )[0-9]+/\\1${n}/g" {} +
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATE README.md docs || true
          git commit -m "Bump update to ${n} [skip update]"
          git push
